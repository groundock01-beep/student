<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – Business Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--surface:#fff;--ink:#12222e;--muted:#566570;--line:#dde2e0;--accent:#0d6b5c;--accent-ink:#fff;--mark:#e8b64a;--hero:#12303d;--hero-ink:#f3f6f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171d;--surface:#16232b;--ink:#e9efec;--muted:#9bacb4;--line:#26363f;--accent:#4fc3a8;--accent-ink:#06211b;--hero:#0a1217;--hero-ink:#f3f6f4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171d;--surface:#16232b;--ink:#e9efec;--muted:#9bacb4;--line:#26363f;--accent:#4fc3a8;--accent-ink:#06211b;--hero:#0a1217;--hero-ink:#f3f6f4;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 "Public Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{width:min(1080px,100% - 2.5rem);margin-inline:auto}
header.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem}
.brand{font:700 1.1rem "Bricolage Grotesque",sans-serif;text-decoration:none;color:var(--ink)}
nav ul{display:flex;gap:1.4rem;list-style:none;margin:0;padding:0}
nav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem;padding:.4rem 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--mark)}
.tools{display:flex;gap:.5rem}
.icon-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
#menu{display:none}
.hero{background:var(--hero);color:var(--hero-ink);padding:clamp(3rem,9vw,6.5rem) 0}
.hero .wrap{display:grid;gap:2.5rem;grid-template-columns:1.4fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6.5vw,4.6rem);letter-spacing:-.02em}
.hero .role{font-size:1.2rem;margin:1rem 0 .5rem;color:var(--mark);font-weight:600}
.hero p.lead{max-width:34rem;color:#c5d3cf;margin:0 0 1.8rem}
.btns{display:flex;gap:.8rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:10px;font-weight:600;text-decoration:none;border:2px solid var(--mark);background:var(--mark);color:#1a1a12}
.btn.ghost{background:transparent;color:var(--hero-ink);border-color:#58717a}
.photo{aspect-ratio:1;border-radius:50% 50% 12px 50%;background:linear-gradient(135deg,#1d4a5a,#0d6b5c);display:grid;place-items:center;font:700 5rem "Bricolage Grotesque",sans-serif;color:var(--mark);overflow:hidden;max-width:320px;justify-self:center;width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:-2rem;position:relative}
.stats div{background:var(--surface);padding:1.1rem 1.2rem}
.stats b{display:block;font:700 1.7rem "Bricolage Grotesque",sans-serif;color:var(--accent)}
.stats span{color:var(--muted);font-size:.9rem}
section{padding:clamp(3rem,7vw,5rem) 0}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:1.8rem}
h2::after{content:"";display:block;width:48px;height:4px;background:var(--mark);margin-top:.7rem;border-radius:2px}
.about{display:grid;grid-template-columns:1.5fr 1fr;gap:2.5rem}
.about p{margin:0 0 1rem;max-width:62ch}
.facts{list-style:none;margin:0;padding:1.2rem 1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;align-self:start}
.facts li{padding:.55rem 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem}
.facts li:last-child{border:0}
.facts span{color:var(--muted)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.4rem}
.panel h3{font-size:1.1rem;margin-bottom:1rem}
.bar{margin-bottom:.9rem}
.bar div:first-child{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:.3rem}
.track{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.tags{display:flex;flex-wrap:wrap;gap:.5rem}
.tag{padding:.3rem .75rem;border:1px solid var(--line);border-radius:99px;font-size:.88rem;background:var(--bg)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.45rem 1rem;border-radius:99px;cursor:pointer;font:500 .9rem "Public Sans",sans-serif}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.3rem}
.project{display:flex;flex-direction:column;gap:.7rem}
.project h3{font-size:1.25rem}
.project p{margin:0;color:var(--muted)}
.project .result{color:var(--ink);font-weight:600;border-left:4px solid var(--mark);padding-left:.7rem}
.project a{margin-top:auto;font-weight:600}
.timeline{list-style:none;margin:0;padding:0 0 0 1.4rem;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 1.8rem 1.2rem}
.timeline li::before{content:"";position:absolute;left:-2.05rem;top:.45rem;width:12px;height:12px;border-radius:50%;background:var(--mark);border:2px solid var(--bg)}
.timeline h3{font-size:1.1rem}
.timeline .when{color:var(--muted);font-size:.9rem;margin:.1rem 0 .4rem}
.timeline p{margin:0;max-width:62ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.contact{background:var(--hero);color:var(--hero-ink)}
.contact h2{color:var(--hero-ink)}
.contact p{color:#c5d3cf;max-width:40rem}
.links{display:grid;gap:.8rem;margin-top:1.5rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.links a{display:block;padding:1rem 1.2rem;border:1px solid #3a525c;border-radius:12px;color:var(--hero-ink);text-decoration:none}
.links a small{display:block;color:var(--mark)}
.links a:hover{border-color:var(--mark)}
footer{padding:1.5rem 0;color:var(--muted);font-size:.9rem;text-align:center}
@media (max-width:820px){
 #menu{display:block}
 nav{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);display:none}
 nav.open{display:block}
 nav ul{flex-direction:column;gap:0;padding:.5rem 1.25rem 1rem}
 nav a{display:block;padding:.7rem 0}
 .hero .wrap,.about,.two{grid-template-columns:1fr}
 .photo{max-width:200px;order:-1;justify-self:start;font-size:3.5rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="#top" id="brand"></a>
  <nav id="nav" aria-label="Main"><ul id="navlist"></ul></nav>
  <div class="tools">
    <button class="icon-btn" id="theme" aria-label="Switch light or dark theme">◐</button>
    <button class="icon-btn" id="menu" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
</div></header>

<main id="top">
<div class="hero"><div class="wrap">
  <div>
    <h1 id="h-name"></h1>
    <p class="role" id="h-role"></p>
    <p class="lead" id="h-tagline"></p>
    <div class="btns"><a class="btn" href="#projects">View my projects</a><a class="btn ghost" href="#contact">Contact me</a></div>
  </div>
  <div class="photo" id="photo"></div>
</div></div>

<div class="wrap"><div class="stats" id="stats"></div></div>

<section id="about"><div class="wrap">
  <h2>About me</h2>
  <div class="about"><div id="about-text"></div><ul class="facts" id="facts"></ul></div>
</div></section>

<section id="skills" style="background:color-mix(in srgb,var(--surface) 55%,var(--bg))"><div class="wrap">
  <h2>Skills</h2><div class="skills" id="skill-groups"></div>
</div></section>

<section id="projects"><div class="wrap">
  <h2>Projects</h2>
  <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
  <div class="projects" id="project-list"></div>
</div></section>

<section id="experience" style="background:color-mix(in srgb,var(--surface) 55%,var(--bg))"><div class="wrap">
  <div class="two">
    <div><h2>Experience</h2><ul class="timeline" id="exp"></ul></div>
    <div><h2>Achievements</h2><ul class="timeline" id="ach"></ul></div>
  </div>
</div></section>

<section class="contact" id="contact"><div class="wrap">
  <h2>Contact</h2>
  <p id="contact-text"></p>
  <div class="links" id="contact-links"></div>
</div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ============================================================
   EDIT YOUR CONTENT HERE. Everything on the page comes from this block.
   - Change text between the quotes.
   - To add a project, skill, job or award: copy one line and paste it below.
   - Add a photo by setting photo: "https://…/your-photo.jpg" (or leave "" to show your initials).
   ============================================================ */
const SITE = {
  name: "Your Name",
  role: "Business Administration student",
  tagline: "I turn data and market research into clear recommendations. Currently looking for a summer internship in marketing or finance.",
  photo: "",
  stats: [
    { value: "3.8", label: "GPA" },
    { value: "6", label: "Projects completed" },
    { value: "2", label: "Internships" },
    { value: "3", label: "Languages spoken" }
  ],
  about: [
    "I’m a third-year business student at Your University, majoring in Marketing with a minor in Finance. I like problems where numbers and people meet: why customers choose one brand over another, and what a business can do about it.",
    "Outside class I lead the university business club, mentor first-year students and run a small online shop to test what I learn in the classroom."
  ],
  facts: [
    ["Location", "Cairo, Egypt"],
    ["Education", "BBA, Your University"],
    ["Graduation", "2028"],
    ["Languages", "Arabic, English, French"],
    ["Available", "Summer internship"]
  ],
  skillGroups: [
    { title: "Business skills", bars: [["Market research", 90], ["Financial analysis", 80], ["Project management", 85], ["Presentation and public speaking", 90]] },
    { title: "Tools", bars: [["Excel and Google Sheets", 90], ["PowerPoint", 95], ["Power BI / Tableau", 70], ["SQL basics", 60]] },
    { title: "Soft skills", tags: ["Leadership", "Teamwork", "Negotiation", "Problem solving", "Time management", "Storytelling"] }
  ],
  projects: [
    { title: "Market entry plan for a coffee brand", category: "Strategy", text: "Analysed three markets, sized demand and built a 3-year launch plan for a specialty coffee brand.", result: "Ranked 1st of 24 teams in the class competition.", link: "" },
    { title: "Customer survey and segmentation", category: "Marketing", text: "Surveyed 220 students, segmented them with cluster analysis and proposed three targeted offers.", result: "Offers tested on a pilot group lifted sign-ups by 18%.", link: "" },
    { title: "Startup financial model", category: "Finance", text: "Built a 5-year Excel model with revenue scenarios, break-even point and cash-flow forecast.", result: "Used by the club as its template for pitch events.", link: "" },
    { title: "Online shop experiment", category: "Marketing", text: "Launched a small online store, ran social media campaigns and tracked conversion each week.", result: "Reached 150 orders in the first four months.", link: "" }
  ],
  experience: [
    { title: "Marketing Intern, Company Name", when: "Jun 2026 – Aug 2026", text: "Prepared weekly campaign reports and helped plan two product launches." },
    { title: "President, University Business Club", when: "Sep 2025 – present", text: "Lead a team of 12 and organise monthly speaker events for 150+ students." },
    { title: "Peer Mentor, Your University", when: "2024 – 2025", text: "Guided 15 first-year students through course planning and study skills." }
  ],
  achievements: [
    { title: "Dean’s List", when: "2025 and 2026", text: "Awarded for top 10% academic results in the faculty." },
    { title: "1st place, Case Competition", when: "March 2026", text: "Won the university case competition against 24 teams." },
    { title: "Certificate: Google Data Analytics", when: "2025", text: "Completed the professional certificate on Coursera." }
  ],
  contact: {
    text: "I’m open to internships, entry-level roles and collaborations. Send me a message and I’ll reply within two days.",
    links: [
      ["Email", "you@example.com", "mailto:you@example.com"],
      ["LinkedIn", "linkedin.com/in/your-name", "https://linkedin.com/in/your-name"],
      ["Phone", "+20 100 000 0000", "tel:+201000000000"],
      ["CV", "Download my CV", "#"]
    ]
  }
};
/* ============================ END OF EDITABLE CONTENT ============================ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = SITE.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();

document.title = SITE.name + " – Business Portfolio";
$("brand").textContent = SITE.name;
$("h-name").textContent = SITE.name;
$("h-role").textContent = SITE.role;
$("h-tagline").textContent = SITE.tagline;
$("photo").innerHTML = SITE.photo ? `<img src="${esc(SITE.photo)}" alt="Photo of ${esc(SITE.name)}">` : esc(initials);

const sections = [["about","About"],["skills","Skills"],["projects","Projects"],["experience","Experience"],["contact","Contact"]];
$("navlist").innerHTML = sections.map(([id,l]) => `<li><a href="#${id}">${l}</a></li>`).join("");

$("stats").innerHTML = SITE.stats.map(s => `<div><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("");
$("about-text").innerHTML = SITE.about.map(p => `<p>${esc(p)}</p>`).join("");
$("facts").innerHTML = SITE.facts.map(([k,v]) => `<li><span>${esc(k)}</span><b>${esc(v)}</b></li>`).join("");

$("skill-groups").innerHTML = SITE.skillGroups.map(g => `<div class="panel"><h3>${esc(g.title)}</h3>` +
  (g.bars ? g.bars.map(([n,v]) => `<div class="bar"><div><span>${esc(n)}</span><span>${v}%</span></div><div class="track" role="progressbar" aria-label="${esc(n)}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${v}%"></div></div></div>`).join("") : "") +
  (g.tags ? `<div class="tags">${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : "") + `</div>`).join("");

const cats = ["All", ...new Set(SITE.projects.map(p => p.category))];
let current = "All";
function drawProjects() {
  $("filters").innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c===current}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("project-list").innerHTML = SITE.projects.filter(p => current === "All" || p.category === current).map(p =>
    `<article class="panel project"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><p class="result">${esc(p.result)}</p>` +
    (p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">View project</a>` : "") + `</article>`).join("");
}
$("filters").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { current = b.dataset.c; drawProjects(); } });
drawProjects();

const tl = arr => arr.map(i => `<li><h3>${esc(i.title)}</h3><div class="when">${esc(i.when)}</div><p>${esc(i.text)}</p></li>`).join("");
$("exp").innerHTML = tl(SITE.experience);
$("ach").innerHTML = tl(SITE.achievements);

$("contact-text").textContent = SITE.contact.text;
$("contact-links").innerHTML = SITE.contact.links.map(([l,t,h]) => `<a href="${esc(h)}"><small>${esc(l)}</small>${esc(t)}</a>`).join("");
$("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

/* menu, theme, active link */
const nav = $("nav"), menu = $("menu");
menu.addEventListener("click", () => { const o = nav.classList.toggle("open"); menu.setAttribute("aria-expanded", o); });
nav.addEventListener("click", e => { if (e.target.closest("a")) { nav.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); } });
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
const links = [...document.querySelectorAll("#navlist a")];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
sections.forEach(([id]) => io.observe($(id)));
</script>
</body>
</html>
